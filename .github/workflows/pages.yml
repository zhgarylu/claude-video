# Builds the style gallery (styleboard/) and publishes it to GitHub Pages on every push to main.
# Films: 720p cuts from the "web" release are copied into the site; full quality stays on the "films" release.
name: gallery

on:
  push:
    branches: [main]
    paths: ['styleboard/**', 'styles/*/poster.jpg', 'styles/*/style.json', 'styles/*/STYLE.md', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 styleboard/build.py --site _site
      # 720p cuts live on the "web" release; Pages serves them as video/mp4 (Safari won't play Release downloads)
      - run: gh release download web --repo "$GITHUB_REPOSITORY" --pattern '*.mp4' --dir _site/films
        env:
          GH_TOKEN: ${{ github.token }}
      # every film the gallery links must be in the site, or its card opens a dead player (e.g. a style pushed before its films were published)
      - name: check that every linked film is in the site
        run: |
          links=$( { grep -o 'data-src="films/[^"]*"' _site/index.html || true; } | sed 's/^data-src="//; s/"$//' | sort -u)
          [ -n "$links" ] || { echo "::error::_site/index.html links no films: did the gallery markup change?"; exit 1; }
          # the catalog says which styles have a film; each of them must be linked (this also makes the number of linked films at least the number of catalog films)
          expected=$(python3 -c "import json; print('\n'.join(s['slug'] for s in json.load(open('styleboard/catalog.json')) if s.get('dur', 0) > 0))")
          [ -n "$expected" ] || { echo "::error::styleboard/catalog.json lists no film for any style, so the gallery would have no videos (build.py run on a machine without the films? restore catalog.json)"; exit 1; }
          missing=0
          for s in $expected; do
            grep -qx "films/$s.mp4" <<< "$links" || { echo "::error::catalog.json says $s has a film, but the gallery does not link films/$s.mp4"; missing=1; }
          done
          for f in $links; do
            [ -s "_site/$f" ] || { echo "::error::the gallery links $f but it is not in _site (is it missing from the 'web' release? run tools/publish.sh)"; missing=1; }
          done
          echo "$(echo "$links" | wc -l) linked films checked, $(echo "$expected" | wc -l) expected from the catalog"
          [ "$missing" = 0 ]
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
