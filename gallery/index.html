<style>
:root {
  --bg: #F3EEE3; --bg2: #EAE3D3; --card: #FBF7EE; --ink: #231A2C; --muted: #6A6273; --line: rgba(35,26,44,.14);
  --violet: #7B5CF5; --violet-ink: #5B3FD6; --teal: #1EA79B; --mustard: #F0B23B; --coral: #EF6F5E; --sky: #3E8FE8;
  --shadow: 0 1px 0 rgba(35,26,44,.05), 0 10px 30px -12px rgba(35,26,44,.25);
  --r: 16px; --sans: Jost, "Noto Sans SC", system-ui, -apple-system, "PingFang SC", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15121B; --bg2: #1C1824; --card: #221D2C; --ink: #F1ECF7; --muted: #A59DB2; --line: rgba(241,236,247,.14);
  --violet: #9B83FF; --violet-ink: #B9A8FF; --shadow: 0 1px 0 rgba(0,0,0,.4), 0 14px 34px -14px rgba(0,0,0,.7); } }
:root[data-theme="dark"] {
  --bg: #15121B; --bg2: #1C1824; --card: #221D2C; --ink: #F1ECF7; --muted: #A59DB2; --line: rgba(241,236,247,.14);
  --violet: #9B83FF; --violet-ink: #B9A8FF; --shadow: 0 1px 0 rgba(0,0,0,.4), 0 14px 34px -14px rgba(0,0,0,.7); }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.55; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
img { display: block; max-width: 100%; }
a { color: inherit; }
.wrap { width: min(1240px, 100% - 40px); margin-inline: auto; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; border: 2px solid var(--ink); background: transparent; color: var(--ink); font: 600 15px var(--sans); text-decoration: none; cursor: pointer; transition: transform .15s, background .15s; }
.btn:hover { transform: translateY(-2px); }
.btn.solid { background: var(--ink); color: var(--bg); }
.btn.violet { background: var(--violet); border-color: var(--violet); color: #fff; }
.btn:focus-visible, .chip:focus-visible, .card:focus-visible, .seg button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }
/* header */
.top { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(14px); background: color-mix(in srgb, var(--bg) 82%, transparent); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 22px; height: 64px; }
.logo { display: flex; align-items: center; gap: 10px; white-space: nowrap; font-weight: 700; font-size: 20px; letter-spacing: .01em; text-decoration: none; }
.logo svg { width: 30px; height: 30px; }
.top nav { display: flex; gap: 6px; margin-left: 14px; }
.top nav a { padding: 8px 12px; border-radius: 10px; text-decoration: none; font-weight: 500; color: var(--muted); }
.top nav a:hover { color: var(--ink); background: var(--bg2); }
.top .sp { flex: 1; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 600 14px var(--sans); cursor: pointer; display: grid; place-items: center; }
.icon-btn:hover { border-color: var(--ink); }
/* hero */
.hero { padding: 64px 0 40px; }
.hero .wrap { display: grid; grid-template-columns: 1.05fr .95fr; gap: 48px; align-items: center; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); font-size: 13px; color: var(--muted); font-weight: 500; }
.eyebrow b { color: var(--violet-ink); }
h1 { font-size: clamp(38px, 5.4vw, 66px); line-height: 1.06; letter-spacing: -.02em; margin: 18px 0 16px; font-weight: 700; }
h1 em { font-style: normal; color: var(--violet); }
html[lang="zh-CN"] h1 { font-size: clamp(34px, 4.6vw, 58px); }
.lead { font-size: 18px; color: var(--muted); max-width: 34em; margin: 0 0 26px; }
.cta { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 34px; }
.stats { display: flex; gap: 14px; flex-wrap: wrap; }
.stat { min-width: 120px; padding: 14px 18px; border: 2px solid var(--ink); border-radius: 14px; background: var(--card); box-shadow: 4px 4px 0 var(--ink); }
.stat b { display: block; font-size: 34px; line-height: 1; letter-spacing: -.02em; }
.stat span { font-size: 13px; color: var(--muted); }
.stat.mine { border-color: var(--violet-ink); box-shadow: 4px 4px 0 var(--violet); } .stat.mine b { color: var(--violet-ink); }
.collage { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; transform: rotate(-3deg); }
.collage figure { margin: 0; position: relative; border-radius: 12px; overflow: hidden; border: 2px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); background: var(--card); }
.collage figure:nth-child(3n+2) { transform: translateY(26px); } .collage figure:nth-child(3n) { transform: translateY(-10px); }
.collage img { aspect-ratio: 16/10; object-fit: cover; width: 100%; }
.collage figcaption { position: absolute; left: 6px; bottom: 6px; padding: 2px 8px; border-radius: 999px; background: var(--violet); color: #fff; font-size: 11px; font-weight: 700; }
/* sections */
section { padding: 56px 0; }
.sec-head { max-width: 760px; margin-bottom: 30px; }
.sec-head .kicker { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--violet-ink); }
h2 { font-size: clamp(28px, 3.6vw, 42px); line-height: 1.12; letter-spacing: -.015em; margin: 8px 0 12px; }
.sec-head p { color: var(--muted); font-size: 17px; margin: 0; }
.band { background: var(--bg2); border-block: 1px solid var(--line); }
/* talking head */
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; counter-reset: s; margin: 0 0 34px; padding: 0; list-style: none; }
.steps li { position: relative; padding: 18px 16px 16px; border: 2px solid var(--ink); border-radius: 14px; background: var(--card); }
.steps li::before { counter-increment: s; content: counter(s, decimal-leading-zero); position: absolute; top: -13px; left: 14px; padding: 0 10px; border-radius: 999px; background: var(--violet); color: #fff; font-weight: 700; font-size: 13px; line-height: 24px; }
.steps h3 { margin: 4px 0 6px; font-size: 18px; } .steps p { margin: 0; font-size: 14px; color: var(--muted); }
.steps code, .cmd { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }
.layouts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 36px; }
.layout { padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
.wire { aspect-ratio: 16/9; border-radius: 8px; border: 2px solid var(--ink); background: var(--bg); position: relative; margin-bottom: 12px; overflow: hidden; }
.wire i { position: absolute; border-radius: 4px; background: var(--violet); opacity: .9; } .wire u { position: absolute; border-radius: 4px; background: repeating-linear-gradient(135deg, var(--line) 0 5px, transparent 5px 10px); border: 1.5px dashed var(--muted); }
.w-split i { left: 6%; top: 10%; width: 32%; height: 80%; } .w-split u { left: 44%; top: 10%; width: 50%; height: 80%; }
.w-pip i { right: 5%; top: 8%; width: 17%; height: 36%; } .w-pip u { left: 5%; top: 8%; width: 70%; height: 84%; }
.w-world i { left: 32%; top: 0; width: 36%; height: 100%; border-radius: 0; opacity: .6; } .w-world u { left: 4%; top: 22%; width: 22%; height: 18%; } .w-world u.b { left: 74%; top: 52%; width: 22%; height: 18%; }
.layout h3 { margin: 0 0 4px; font-size: 17px; } .layout p { margin: 0; font-size: 14px; color: var(--muted); } .layout code { display: inline-block; margin-top: 6px; padding: 1px 8px; border-radius: 6px; background: var(--bg2); font: 600 12.5px ui-monospace, "SF Mono", Menlo, monospace; color: var(--violet-ink); }
.demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.demo { border: 2px solid var(--ink); border-radius: var(--r); overflow: hidden; background: var(--card); box-shadow: 6px 6px 0 var(--ink); cursor: pointer; text-align: left; padding: 0; font: inherit; color: inherit; transition: transform .15s, box-shadow .15s; }
.demo:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--ink); }
.demo .thumb { position: relative; } .demo .thumb img { aspect-ratio: 16/9; object-fit: cover; width: 100%; }
.demo .body { padding: 16px 18px 18px; } .demo h3 { margin: 0 0 4px; font-size: 21px; }
.demo .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid var(--line); background: var(--bg); color: var(--muted); }
.badge.v { background: var(--violet); border-color: var(--violet); color: #fff; }
.demo p { margin: 0; font-size: 14.5px; color: var(--muted); }
.cmdbox { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; padding: 16px 20px; border-radius: 14px; background: var(--ink); color: var(--bg); }
.cmdbox .cmd { color: #E7DCCA; word-break: break-all; } .cmdbox .btn { border-color: var(--bg); color: var(--bg); padding: 8px 14px; font-size: 14px; }
/* prompts */
.prompts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; align-items: start; }
.pcard { min-width: 0; border: 2px solid var(--ink); border-radius: var(--r); background: var(--card); padding: 18px 18px 16px; box-shadow: 6px 6px 0 var(--ink); display: grid; gap: 10px; }
.pcard h3 { margin: 0; font-size: 20px; line-height: 1.25; } .pcard .world { margin: 0; font-size: 14.5px; color: var(--muted); }
.pcard .badges { display: flex; flex-wrap: wrap; gap: 6px; }
.demo.v .thumb img { object-fit: contain; background: #0b0b0d; }
.v-media.portrait { justify-items: center; }
.v-media.portrait img, .v-media.portrait video { width: auto; max-height: min(78dvh, 760px); aspect-ratio: 9/16; margin: 0 auto; }
.badge.ok { background: #1f8f4a; border-color: #1f8f4a; color: #fff; }
.pcard details { border-top: 1px solid var(--line); padding-top: 10px; } .pcard summary { cursor: pointer; font-weight: 600; font-size: 14.5px; }
.pcard pre { margin: 10px 0 0; max-height: 340px; overflow: auto; padding: 12px; border-radius: 10px; background: var(--bg2); border: 1px solid var(--line); white-space: pre-wrap; word-break: break-word; font: 13px/1.65 ui-monospace, "SF Mono", Menlo, "PingFang SC", monospace; }
.pcard .row .btn { padding: 8px 14px; font-size: 14px; }
/* play glyph */
.play { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.play i { width: 54px; height: 54px; border-radius: 50%; background: rgba(251,247,238,.92); border: 2px solid var(--ink); display: grid; place-items: center; transition: transform .15s; }
.play i::after { content: ""; border-left: 15px solid var(--ink); border-block: 9px solid transparent; margin-left: 4px; }
.demo:hover .play i, .card:hover .play i { transform: scale(1.1); }
/* styles */
.toolbar { display: grid; gap: 14px; margin-bottom: 22px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search { flex: 1 1 260px; position: relative; } .search input { width: 100%; padding: 12px 16px 12px 42px; border-radius: 12px; border: 2px solid var(--ink); background: var(--card); color: var(--ink); font: 500 16px var(--sans); }
.search svg { position: absolute; left: 14px; top: 50%; translate: 0 -50%; width: 18px; height: 18px; color: var(--muted); }
select { padding: 12px 14px; border-radius: 12px; border: 2px solid var(--ink); background: var(--card); color: var(--ink); font: 500 15px var(--sans); }
.seg { display: inline-flex; border: 2px solid var(--ink); border-radius: 12px; overflow: hidden; background: var(--card); }
.seg button { padding: 10px 14px; border: 0; background: transparent; color: var(--ink); font: 600 14px var(--sans); cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; } .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); } .seg button.mine[aria-pressed="true"] { background: var(--violet); color: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 500 14px var(--sans); cursor: pointer; }
.chip:hover { border-color: var(--ink); } .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.count { color: var(--muted); font-size: 14px; } .legend { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(262px, 1fr)); gap: 20px; }
.card { position: relative; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); overflow: hidden; cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s; box-shadow: var(--shadow); }
.card:hover { transform: translateY(-4px); border-color: var(--ink); }
.card.added { border: 2px solid var(--violet); }
.card .thumb { position: relative; } .card .thumb img { aspect-ratio: 16/9; object-fit: cover; width: 100%; background: var(--bg2); }
.tag { position: absolute; top: 10px; left: 10px; padding: 3px 10px; border-radius: 999px; background: var(--violet); color: #fff; font-size: 12px; font-weight: 700; box-shadow: 0 3px 10px -3px rgba(0,0,0,.5); }
.dur { position: absolute; right: 10px; bottom: 10px; padding: 1px 8px; border-radius: 6px; background: rgba(20,16,26,.78); color: #fff; font-size: 12px; font-variant-numeric: tabular-nums; }
.card .meta { padding: 12px 14px 15px; } .card h3 { margin: 0; font-size: 18px; line-height: 1.25; } .card .cn { margin: 2px 0 6px; font-size: 14px; color: var(--muted); }
.card .film { margin: 0; font-size: 13px; color: var(--muted); font-style: italic; }
.empty { padding: 60px 0; text-align: center; color: var(--muted); }
/* viewer */
dialog { border: 0; padding: 0; width: min(1100px, 100% - 28px); max-height: calc(100dvh - 28px); border-radius: 20px; background: var(--card); color: var(--ink); box-shadow: 0 30px 80px -20px rgba(0,0,0,.6); }
dialog::backdrop { background: rgba(20,16,26,.7); backdrop-filter: blur(4px); }
.v-wrap { display: grid; grid-template-columns: 1.35fr 1fr; max-height: calc(100dvh - 28px); overflow: auto; }
.v-media { background: #000; position: relative; min-height: 220px; display: grid; align-content: center; }
.v-media video, .v-media img { width: 100%; aspect-ratio: 16/9; object-fit: contain; background: #000; }
.v-info { padding: 26px 26px 24px; display: grid; gap: 12px; align-content: start; }
.v-info h3 { margin: 0; font-size: 28px; line-height: 1.15; } .v-info .cn { margin: -6px 0 0; color: var(--muted); font-size: 17px; }
.v-info .film { font-style: italic; font-size: 17px; } .v-info p { margin: 0; color: var(--muted); }
.uses { display: flex; flex-wrap: wrap; gap: 6px; } .uses span { padding: 3px 10px; border-radius: 999px; background: var(--bg2); font-size: 13px; }
.origin { padding: 10px 12px; border-radius: 12px; font-size: 14px; background: var(--bg2); border: 1px solid var(--line); }
.origin.mine { background: color-mix(in srgb, var(--violet) 14%, var(--card)); border-color: var(--violet); }
.v-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.v-left { position: relative; background: #000; display: grid; align-content: center; } .v-left .v-media { min-height: 0; }
.close { position: absolute; top: 12px; right: 12px; z-index: 3; } .nav-b { position: absolute; top: 50%; translate: 0 -50%; z-index: 3; background: rgba(251,247,238,.9); color: #231A2C; border-color: transparent; } .prev { left: 10px; } .next { right: 10px; }
/* footer */
footer { padding: 46px 0 60px; border-top: 1px solid var(--line); background: var(--bg2); }
footer .wrap { display: grid; grid-template-columns: 1.3fr 1fr; gap: 30px; } footer h4 { margin: 0 0 8px; font-size: 16px; } footer p { margin: 0 0 8px; color: var(--muted); font-size: 14.5px; }
@media (max-width: 960px) {
  .hero .wrap { grid-template-columns: 1fr; } .collage { max-width: 520px; transform: none; }
  .steps, .layouts, .demos, .prompts { grid-template-columns: 1fr 1fr; } .v-wrap { grid-template-columns: 1fr; } footer .wrap { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .steps, .layouts, .demos, .prompts { grid-template-columns: 1fr; } .top nav { display: none; } .top .wrap { gap: 10px; } .top .btn { padding: 8px 12px; font-size: 14px; } .hero { padding-top: 36px; } section { padding: 40px 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>

  <a class="logo" href="#top" aria-label="Claude Video"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3l11 6.5L16 16 5 9.5z" fill="#A590FF"/><path d="M5 9.5L16 16v13L5 22.5z" fill="#7B5CF5"/><path d="M16 16l11-6.5v13L16 29z" fill="#5B3FD6"/></svg>Claude Video</a>

  <span class="sp"></span>

</div></section>

<section id="styles"><div class="wrap">
  <div class="sec-head"><span class="kicker" data-i="s_kicker"></span><h2 data-i="s_h"></h2><p data-i="s_p"></p></div>
  <div class="toolbar">
    <div class="row">

$('#q').addEventListener('input', e => { st.q = e.target.value; renderGrid(); });
$('#sort').addEventListener('change', e => { st.sort = e.target.value; renderGrid(); });
$('#lang').onclick = () => { lang = lang === 'zh' ? 'en' : 'zh'; store.set('lang', lang); applyI18n(); if (cur) open(cur.kind, cur.id, false); };
$('#theme').onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; store.set('theme', r.dataset.theme); };
const th = store.get('theme'); if (th) document.documentElement.dataset.theme = th;

// ---- init ----
$('#n-total').textContent = G.counts.total; $('#n-added').textContent = G.counts.added; $('#n-demos').textContent = G.counts.demos;
renderCollage(); applyI18n();
const m = /^#(style|demo)=([\w-]+)/.exec(location.hash); if (m) open(m[1], m[2], false);
})();
</script>
</body>
</html>
